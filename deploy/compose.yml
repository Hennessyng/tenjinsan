x-app: &app
  user: "1000:1000"
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=1770
  volumes:
    - private-data:/data
  networks: [backend]
  healthcheck:
    test: [CMD, node, --experimental-transform-types, deploy/health.ts]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 30s
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  api:
    <<: *app
    build: {context: .., dockerfile: deploy/Dockerfile, target: api}
    environment:
      AUTH_BASE_URL: ${CANONICAL_ORIGIN:?Set CANONICAL_ORIGIN to your HTTPS origin}
      TRUSTED_ORIGINS: ${CANONICAL_ORIGIN:?Set CANONICAL_ORIGIN to your HTTPS origin}
      AUTH_SECRET: ${AUTH_SECRET:?Set a private AUTH_SECRET of at least 32 characters}
      DATABASE_PATH: /data/studio.sqlite
      PRIVATE_DATA_ROOT: /data/private
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8787"
      TRUST_PROXY: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128

  worker:
    <<: *app
    build: {context: .., dockerfile: deploy/Dockerfile, target: worker}
    environment:
      DATABASE_PATH: /data/studio.sqlite
      PRIVATE_DATA_ROOT: /data/private
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XDG_CONFIG_HOME: /tmp/chromium-config
      XDG_CACHE_HOME: /tmp/chromium-cache
    depends_on:
      api: {condition: service_healthy}
    security_opt:
      - no-new-privileges:true
      - seccomp=./chromium-seccomp.json
    networks: [worker-egress]
    shm_size: 512m
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512

  proxy:
    build: {context: .., dockerfile: deploy/Dockerfile.proxy}
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      CANONICAL_ORIGIN: ${CANONICAL_ORIGIN:?Set CANONICAL_ORIGIN to your HTTPS origin}
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PROXY_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, backend]
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 10s
      timeout: 5s
      retries: 3
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64

networks:
  backend: {internal: true}
  edge: {}
  worker-egress: {}
volumes:
  private-data: {}
  caddy-data: {}
  caddy-config: {}
